services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: sec_fsds
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./docker/init_reader.sh:/docker-entrypoint-initdb.d/02_init_reader.sh:ro
      - ./sql/indexes.sql:/docker-entrypoint-initdb.d/03_indexes.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/04_views.sql:ro
      - ./sql/comments.sql:/docker-entrypoint-initdb.d/05_comments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owner -d sec_fsds"]
      interval: 2s
      retries: 30

  # V1.3 step 4: second database = MySQL with the Sakila sample database (sql/sakila/, New BSD license)
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_READER_PASSWORD: ${MYSQL_READER_PASSWORD:?set MYSQL_READER_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./sql/sakila/sakila-schema.sql:/docker-entrypoint-initdb.d/01_sakila-schema.sql:ro
      - ./sql/sakila/sakila-data.sql:/docker-entrypoint-initdb.d/02_sakila-data.sql:ro
      - ./docker/init_mysql_reader.sh:/docker-entrypoint-initdb.d/03_init_reader.sh:ro
    ports:
      - "127.0.0.1:3306:3306"      # only this machine can connect (local evals); not open to the internet
    healthcheck:
      # TCP ping: fails while the init scripts run (the server is socket-only then), so "healthy" = data loaded
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 2s
      retries: 60

  app:
    build: .
    image: reliable-text-to-sql
    env_file: .env                 # ANTHROPIC_API_KEY is read from the file, not the shell
    environment:
      DATABASE_URL: host=db dbname=sec_fsds user=text2sql_reader password=${READER_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  loader:                          # one-off: docker compose run --rm loader
    image: reliable-text-to-sql
    profiles: ["tools"]
    environment:
      LOADER_DATABASE_URL: host=db dbname=sec_fsds user=owner password=${POSTGRES_PASSWORD}
    volumes:
      - ./data/raw:/app/data/raw:ro
    command: ["python", "src/load_data.py"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  mysqldata:
